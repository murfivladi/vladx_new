ru = ["список"]
it = ["lista"]
scn = []

[[type]]
id = "map"
ru = ["словарь", "объект"]
it = ["mappa", "oggetto"]
scn = []

[[type]]
id = "function"
ru = ["функция"]
it = ["funzione"]
scn = []

# ═════════════ слова манифеста vladx.toml (разделы и поля) ═════════════
