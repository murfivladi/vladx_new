# VladX — ЕДИНСТВЕННЫЙ источник ключевых слов.
#
# Парсер не содержит ни одной словоформы: он читает этот файл и работает
# с нейтральными id операций. Добавить синоним = добавить строку сюда.
#
# Поля записи [[op]]:
#   id      — нейтральный идентификатор (латиницей, стабилен, попадает в AST-логику)
#   ru/it/scn — все допустимые словоформы и синонимы (фразы из нескольких слов разрешены)
#   status  — fixed (утверждено) | draft (черновик, ждёт проверки носителем)
#   [op.support.<роль>] — служебные слова конструкции (то, раз, из, ...)
#
# Сравнение слов — без учёта регистра, после нормализации NFC.
# Из нескольких подходящих фраз выбирается самая длинная.
# Знак «=» после имени в объявлении принимается во всех языках.

schema_version = 1
default_lang = "ru"
langs = ["ru", "it", "scn"]

# ───────────────────────── переменные ─────────────────────────

[[op]]
id = "var.declare"
status = "draft"
ru = ["пусть", "создай", "заведи", "объяви"]
it = ["sia", "crea", "dichiara"]
scn = ["fussi", "cria"]
[op.support.be]
ru = ["будет"]
it = []
scn = []

[[op]]
id = "var.mutable"
status = "draft"
ru = ["изменяй", "изменяемая", "переменная"]
it = ["variabile", "modificabile"]
scn = ["variàbbili"]

[[op]]
id = "var.assign"
status = "draft"
ru = ["станет", "присвой", "замени на"]
it = ["diventa", "assegna"]
scn = ["diventa"]

# ───────────────────────── ввод-вывод ─────────────────────────

[[op]]
id = "io.say"
status = "fixed"
ru = ["скажи", "выведи", "напиши", "покажи"]
it = ["dì", "mostra", "scrivi"]
scn = ["dici", "mostra"]

[[op]]
id = "io.ask"
status = "fixed"
ru = ["спроси"]
it = ["chiedi"]
scn = ["addumanna"]
[op.support.into]
ru = ["и сохрани в", "и запиши в"]
it = ["e salva in"]
scn = ["e sarba in"]

# ───────────────────────── управление ─────────────────────────

[[op]]
id = "ctrl.if"
status = "fixed"
ru = ["если"]
it = ["se"]
scn = ["si"]
[op.support.then]
ru = ["то"]
it = ["allora"]
scn = ["allura"]

[[op]]
id = "ctrl.else"
status = "fixed"
ru = ["иначе", "в противном случае"]
it = ["altrimenti", "sennò"]
scn = ["sinò", "autrimenti"]

[[op]]
id = "ctrl.while"
status = "fixed"
ru = ["пока", "до тех пор пока"]
it = ["finché", "mentre"]
scn = ["mentri"]

[[op]]
id = "ctrl.repeat"
status = "draft"
ru = ["повторяй"]
it = ["ripeti"]
scn = ["arrèpiti"]
[op.support.times]
ru = ["раз"]
it = ["volte"]
scn = ["voti"]

[[op]]
id = "ctrl.foreach"
status = "draft"
ru = ["для каждого"]
it = ["per ogni"]
scn = ["pi ogni"]
[op.support.iter]
ru = ["из", "в"]
it = ["in", "di"]
scn = ["di", "nni"]

[[op]]
id = "ctrl.iterate"
status = "draft"
# Сахар над ctrl.foreach. Открытый вопрос §14.5: парсер пока сообщает,
# что конструкция не поддержана, и предлагает «для каждого».
ru = ["пройди по"]
it = ["passa per"]
scn = ["passa pi"]

[[op]]
id = "ctrl.break"
status = "fixed"
ru = ["прерви", "останови"]
it = ["interrompi"]
scn = ["ntirrumpi"]

[[op]]
id = "ctrl.continue"
status = "fixed"
ru = ["продолжи", "пропусти"]
it = ["continua", "salta"]
scn = ["cuntinua"]

# ───────────────────────── функции и объекты ─────────────────────────

