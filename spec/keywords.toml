# Не зарезервированы: ищутся только после «:» в списке параметров.
# В AST попадает нейтральный id. Сицилийские формы ждут носителя (§14).

[[type]]
id = "number"
ru = ["число"]
it = ["numero"]
scn = []

[[type]]
id = "string"
ru = ["строка", "текст"]
it = ["testo", "stringa"]
