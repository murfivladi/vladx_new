[package]
name = "vladx-cli"
description = "CLI VladX: run, parse, check, keywords, serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vladx"
path = "src/main.rs"

[[bin]]
name = "vladpm"
path = "src/vladpm.rs"

[dependencies]
vladx-ast = { path = "../vladx-ast" }
vladx-syntax = { path = "../vladx-syntax" }
vladx-runtime = { path = "../vladx-runtime" }
vladx-hmn = { path = "../vladx-hmn" }
vladx-pm = { path = "../vladx-pm" }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
